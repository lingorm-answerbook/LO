<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>正在重新導向...</title>
    <script>
        // 將剛才從 Excel C 欄複製出來的 300 行，直接貼在下方：
        const qrRoutes = {
"1": "https://google.com",
"2": "https://yahoo.com.hk",
"3": "https://gmail.com",
"300": "https://google.com.hk"
        }; // 貼在這一行上方（注意：最後一行的網址後面有沒有逗號都沒關係，瀏覽器看得懂）

        // 自動獲取網址列後面的 ?id= 參數
        const urlParams = new URLSearchParams(window.location.search);
        const qrId = urlParams.get('id');

        // 自動跳轉
        if (qrId && qrRoutes[qrId]) {
            window.location.href = qrRoutes[qrId];
        } else {
            // 這裡可以改成你的主網站首頁，以防有人亂打編號
            window.location.href = "https://your-main-store.com";
        }
    </script>
</head>
<body>
    <p style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        頁面跳轉中，請稍候... 如果沒有自動跳轉，請點擊此處。
    </p>
</body>
</html>
