<script>
    const qrRoutes = {
        "1": "https://x.com/i/status/2000918169578561965",
        "2": "https://google.com"
    };

    const urlParams = new URLSearchParams(window.location.search);
    const qrId = urlParams.get('id');

    // 【除錯用彈窗】網頁打開時，會彈出視窗告訴我們它抓到什麼 ID
    alert("網頁目前抓到的 ID 是: " + qrId);

    if (qrId && qrRoutes[qrId]) {
        window.location.href = qrRoutes[qrId];
    } else {
        alert("找不到這個 ID，準備跳轉到預設首頁");
        window.location.href = "https://google.com"; // 先暫時改成 google 方便測試
    }
</script>
