<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在重新導向...</title>
    <script>
        // 將 Excel C 欄複製出來的資料貼在下方：
        const qrRoutes = {
            "1": "https://x.com/i/status/2000918169578561965",
            "2": "https://google.com",
            "3": "https://example.com",
            "300": "https://example.com00"
        }; 

        // 預設跳轉的主網站（防呆網址）
        const defaultUrl = "https://your-main-store.com";

        // 解析網址參數
        const urlParams = new URLSearchParams(window.location.search);
        const qrId = urlParams.get('id');

        // 決定最終目的地
        const targetUrl = (qrId && qrRoutes[qrId]) ? qrRoutes[qrId] : defaultUrl;

        // 執行自動跳轉
        window.location.href = targetUrl;

        // 當網頁載入完成後，把目的地塞進畫面的超連結（防呆用）
        window.addEventListener('DOMContentLoaded', () => {
            const fallbackLink = document.getElementById('fallback-link');
            if (fallbackLink) {
                fallbackLink.href = targetUrl;
            }
        });
    </script>
</head>
<body>
    <p style="text-align: center; margin-top: 50px; font-family: sans-serif; font-size: 18px;">
        頁面跳轉中，請稍候...<br><br>
        如果沒有自動跳轉，請 <a id="fallback-link" href="#" style="color: #0066cc; text-decoration: underline;">點擊此處</a>。
    </p>
</body>
</html>
